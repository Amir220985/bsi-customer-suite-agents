#liveDlg::backdrop{background:rgba(0,0,0,.5)}

<style>
/* Layout: Leitstand für Laptop und Web. Auftrag links, Team in der Mitte, Ergebnisse rechts.
   Look: schwarz, weiß, Grün, kantige Flächen, Open Sans (Deloitte-inspiriert). */
:root{
  --brand:#86BC25;
  --bg:#efefef; --surface:#ffffff; --surface-2:#f6f6f5; --ink:#0a0a0a; --muted:#5b5d5f; --line:#d4d4d2;
  --accent:#2a7d12; --accent-soft:#e9f4d6;
  --btn-bg:#0a0a0a; --btn-ink:#ffffff; --btn-hover-bg:#86BC25; --btn-hover-ink:#000000;
  --warn:#8a5a00; --warn-soft:#fbefd3; --bad:#a3301f; --bad-soft:#f9e1dc; --ok:#1f6b32; --ok-soft:#e1f2e4;
  --focus:#0076a8; --logo-bg:transparent;
  --font:"Open Sans",Arial,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#050505; --surface:#141414; --surface-2:#1c1c1c; --ink:#f3f3f3; --muted:#a8a9ab; --line:#333333;
  --accent:#86BC25; --accent-soft:#1f2c0d;
  --btn-bg:#86BC25; --btn-ink:#000000; --btn-hover-bg:#ffffff; --btn-hover-ink:#000000;
  --warn:#f0c264; --warn-soft:#38300f; --bad:#ff9a88; --bad-soft:#3d1a14; --ok:#7fd49b; --ok-soft:#14301f;
  --focus:#5fb7e5; --logo-bg:#ffffff; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#050505; --surface:#141414; --surface-2:#1c1c1c; --ink:#f3f3f3; --muted:#a8a9ab; --line:#333333;
  --accent:#86BC25; --accent-soft:#1f2c0d;
  --btn-bg:#86BC25; --btn-ink:#000000; --btn-hover-bg:#ffffff; --btn-hover-ink:#000000;
  --warn:#f0c264; --warn-soft:#38300f; --bad:#ff9a88; --bad-soft:#3d1a14; --ok:#7fd49b; --ok-soft:#14301f;
  --focus:#5fb7e5; --logo-bg:#ffffff; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
html.pres body{font-size:17px}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr)}

/* Kopfzeile */
.top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 20px;background:var(--surface);border-bottom:1px solid var(--line);border-top:4px solid var(--brand)}
.logo{display:flex;align-items:center;min-height:34px;padding-right:14px;border-right:1px solid var(--line)}
.logo img[hidden],.logo-ph[hidden]{display:none}
.logo img{display:block;max-height:30px;max-width:150px;width:auto;background:var(--logo-bg);padding:2px 4px}
.logo-ph{border:1px dashed var(--muted);background:transparent;color:var(--muted);padding:5px 10px;font-size:.78em;letter-spacing:.04em;text-transform:uppercase}
.logo-ph:hover{border-color:var(--ink);color:var(--ink)}
html.pres .logo-ph{display:none}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-size:1.18em;font-weight:700;letter-spacing:.005em}
.brand span{font-size:.72em;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.ctrls{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{border:0;background:transparent;padding:5px 12px;color:var(--ink);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-ink)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.btn{border:1px solid var(--ink);background:var(--surface);border-radius:0;padding:5px 12px;font-weight:600}
.btn:hover:not(:disabled){background:var(--btn-hover-bg);color:var(--btn-hover-ink);border-color:var(--btn-hover-bg)}
.btn.primary{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.btn.primary:hover:not(:disabled){background:var(--btn-hover-bg);color:var(--btn-hover-ink);border-color:var(--btn-hover-bg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
select.btn{padding-right:6px;max-width:100%}
.chk{display:flex;gap:8px;align-items:center;font-size:.9em;color:var(--ink);padding:3px 0;white-space:nowrap}
.opts{position:relative}
.opts summary{list-style:none;cursor:pointer;border:1px solid var(--ink);padding:5px 12px;font-weight:600;background:var(--surface)}
.opts summary::-webkit-details-marker{display:none}
.opts summary::after{content:" ▾"}
.opts[open] summary{background:var(--btn-bg);color:var(--btn-ink)}
.opts .panel{position:absolute;right:0;top:calc(100% + 4px);z-index:30;background:var(--surface);border:1px solid var(--ink);padding:10px 14px;display:grid;gap:4px;min-width:250px;box-shadow:0 8px 24px rgba(0,0,0,.22)}

/* Phasenleiste und Kennzahlen */
.bar{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:flex-end;justify-content:space-between;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.steps{display:flex;flex-wrap:wrap;gap:0;list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:7px;padding:9px 14px 7px;color:var(--muted);font-size:.9em;font-weight:600;border-bottom:4px solid transparent}
.steps li .dot{width:8px;height:8px;background:currentColor;opacity:.4}
.steps li.done{color:var(--ink)}
.steps li.done .dot{background:var(--brand);opacity:1}
.steps li.active{color:var(--ink);border-bottom-color:var(--brand)}
.steps li.active .dot{background:var(--brand);opacity:1}
.metrics{display:flex;flex-wrap:wrap;gap:2px 20px;font-size:.86em;margin:0;padding:8px 0}
.metrics div{display:flex;gap:6px;align-items:baseline}
.metrics dt{color:var(--muted)}
.metrics dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}

/* Hauptbereich */
main{display:grid;grid-template-columns:minmax(320px,.85fr) minmax(400px,1.25fr) minmax(400px,1.2fr);gap:14px;padding:14px 20px;min-height:0}
.pane{background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.pane>h2{margin:0;padding:10px 14px;font-size:.74em;text-transform:uppercase;letter-spacing:.12em;font-weight:700;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:3px solid var(--ink)}
.pane>h2 .hint{font-weight:600;color:var(--muted);letter-spacing:.06em}
.scroll{overflow:auto;flex:1;min-height:0;padding:12px 14px}

/* Avatare */
.av{--c:#555;display:inline-block;width:26px;height:26px;flex:none}
.av svg{width:100%;height:100%;display:block;fill:color-mix(in srgb,var(--c) 85%,#000)}

/* Auftrag / Chat */
.bubble{max-width:94%;padding:9px 12px;margin:0 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble small{display:block;color:var(--muted);font-size:.76em;margin-bottom:2px;font-weight:600}
.bubble.pm{background:var(--surface-2);border:1px solid var(--line)}
.bubble.me{background:var(--accent-soft);margin-left:auto;border:1px solid color-mix(in srgb,var(--brand) 60%,transparent)}
.bubble.sys{background:transparent;border:1px dashed var(--line);color:var(--muted);max-width:100%;font-size:.88em}
.bubble.q{border-left:4px solid var(--warn)}
.gate{border:2px solid var(--brand);padding:12px;margin:4px 0 10px;background:var(--surface)}
.gate h3{margin:0 0 4px;font-size:1em}
.gate p{margin:0 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.gate .row{display:flex;flex-wrap:wrap;gap:8px}
.gate .chg{margin-top:10px;display:grid;gap:8px}
.composer{border-top:1px solid var(--line);padding:10px 14px;display:grid;gap:8px;background:var(--surface-2)}
.composer textarea{width:100%;min-height:78px;resize:vertical;border:1px solid var(--ink);border-radius:0;padding:8px 10px;background:var(--surface);overflow-wrap:anywhere}
.composer textarea:disabled{opacity:.5;border-color:var(--line)}
.composer .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.composer .hint{font-size:.82em;color:var(--muted);flex:1;min-width:160px}
.mic{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:var(--surface);border-radius:0;padding:5px 14px;font-weight:600}
.mic svg{width:18px;height:18px}
.mic:hover:not(:disabled){background:var(--btn-hover-bg);color:var(--btn-hover-ink);border-color:var(--btn-hover-bg)}
.mic.rec{background:var(--bad);color:#fff;border-color:var(--bad)}
.mic:disabled{opacity:.4;cursor:not-allowed}

/* Team */
.agents{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.agent{display:flex;gap:8px;align-items:center;padding:5px 7px;border:1px solid var(--line);min-width:0;background:var(--surface)}
.agent .nm{min-width:0;line-height:1.2}
.agent .nm b{display:block;font-size:.78em;font-weight:700;overflow-wrap:normal;hyphens:manual}
.agent .nm span{font-size:.7em;color:var(--muted)}
.agent.work{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 28%,transparent)}
.agent.work .nm span{color:var(--ink);font-weight:700}
@media (prefers-reduced-motion: no-preference){.agent.work{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 14%,transparent)}}}
.filters{display:flex;gap:10px;flex-wrap:wrap;padding:6px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);font-size:.86em}
.filters select{border:1px solid var(--line);border-radius:0;padding:3px 6px;background:var(--surface);max-width:100%}
.msg{border:1px solid var(--line);border-left:4px solid var(--ink);padding:8px 10px;margin:0 0 8px;background:var(--surface)}
.msg>header{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg .route{display:flex;gap:6px;align-items:center;font-size:.86em;font-weight:700;min-width:0}
.msg .route i{font-style:normal;color:var(--muted)}
.msg details{margin-top:6px}
.msg summary{cursor:pointer;font-weight:600;overflow-wrap:anywhere}
.msg .body{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:0;padding:1px 7px;font:600 .74em var(--mono);color:var(--muted)}
button.chip:hover{border-color:var(--brand);background:var(--accent-soft);color:var(--ink)}
.tag{margin-left:auto;font-size:.68em;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border:1px solid var(--line);color:var(--muted)}
.t-question{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.t-gate{background:var(--btn-bg);color:var(--btn-ink);border-color:transparent}
.t-finding{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.t-artifact{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.t-decision{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.empty{color:var(--muted);border:1px dashed var(--line);padding:16px;text-align:center}
.summary{border:2px solid var(--brand);padding:14px;margin:6px 0 10px;background:var(--surface)}
.summary h3{margin:0 0 8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:0 0 12px}
.kpis div{background:var(--surface-2);padding:8px 10px;border-top:3px solid var(--brand)}
.kpis dt{font-size:.7em;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.kpis dd{margin:0;font-size:1.45em;font-weight:700;font-variant-numeric:tabular-nums}

/* Ergebnisse */
.tabs{display:flex;gap:0;flex-wrap:wrap;padding:0 8px;border-bottom:1px solid var(--line);background:var(--surface)}
.tabs button{border:0;border-bottom:3px solid transparent;background:transparent;padding:8px 10px 6px;color:var(--muted);font-size:.84em;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.tabs .n{font:700 .8em var(--mono);background:var(--accent-soft);color:var(--ink);padding:0 6px}
.card{border:1px solid var(--line);padding:10px 12px;margin:0 0 10px;background:var(--surface)}
.card h3{margin:0 0 4px;font-size:.96em;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h3 .id{font:600 .76em var(--mono);color:var(--muted)}
.card p{margin:4px 0;overflow-wrap:anywhere}
.card ul,.card ol{margin:4px 0 4px 18px;padding:0}
.card li{margin:2px 0;overflow-wrap:anywhere}
.card dl{margin:6px 0 0}
.card dt{font-size:.72em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:6px;font-weight:700}
.card dd{margin:0;overflow-wrap:anywhere}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--brand)}100%{box-shadow:0 0 0 0 transparent}}
.badge{font-size:.7em;font-weight:700;padding:1px 8px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
.b-must{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.b-should{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.b-could{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.b-demo{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.b-ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.b-bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.sw{display:inline-flex;align-items:center;gap:6px;margin-right:10px;font:600 .8em var(--mono)}
.sw i{width:16px;height:16px;border:1px solid var(--line);display:inline-block}
.tblwrap{overflow:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.88em}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--surface-2);font-size:.72em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);position:sticky;top:0}
td .chips{margin:0 0 2px}
.tree{font:400 .84em/1.6 var(--mono);margin:0;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);overflow:auto;white-space:pre}
.note{padding:10px 12px;margin:0 0 10px;background:var(--warn-soft);color:var(--warn);font-size:.9em;border-left:4px solid var(--warn)}
.note b{font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;max-width:min(92vw,520px);z-index:40;box-shadow:0 6px 24px rgba(0,0,0,.3)}
html.pres .filters,html.pres .chk{display:none}


/* Widgets */
:root{--seq1:#2a7d12;--seq2:#6aa332;--seq3:#b4d189}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--seq1:#86BC25;--seq2:#5f8d22;--seq3:#3e5c17}}
:root[data-theme="dark"]{--seq1:#86BC25;--seq2:#5f8d22;--seq3:#3e5c17}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.wd{border:1px solid var(--line);background:var(--surface);padding:10px 12px;min-width:0;border-top:3px solid var(--ink)}
.wd.wide{grid-column:1/-1}
.wd h4{margin:0 0 8px;font-size:.68em;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.big{font-size:2.3em;font-weight:700;line-height:1;letter-spacing:-.01em}
.big small{font-size:.45em;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.sub{color:var(--muted);font-size:.82em;margin-top:4px}
.meter{height:8px;background:var(--accent-soft);border-radius:4px;overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0;transition:width .5s ease}
.hbars{display:grid;gap:5px}
.hb{display:grid;grid-template-columns:22px minmax(80px,112px) 1fr 26px;gap:8px;align-items:center;padding:1px 0;font-size:.84em}
.hb .nm{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{height:14px}
.hb .tr i{display:block;height:14px;background:var(--accent);border-radius:0 4px 4px 0;min-width:0;transition:width .4s ease}
.hb .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.hb:hover{background:var(--surface-2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:.82em}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;display:inline-block}
.stack{display:block;width:100%;height:auto}
.spark{display:block;width:100%;height:auto;overflow:visible}
.spark text,.net text{font-family:var(--font)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface-2);padding:8px 10px}
.tile b{display:block;font-size:1.7em;line-height:1.1;font-weight:700}
.tile span{font-size:.74em;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.viewhead{display:flex;justify-content:flex-end;padding:6px 14px 0}
.seg.sm button{padding:2px 10px;font-size:.8em}
.netwrap{padding:4px 14px 8px;border-bottom:1px solid var(--line)}
.net{display:block;width:100%;height:auto}
.net .nd .fig{stroke:var(--surface);stroke-width:.9;stroke-linejoin:round}
.net .nd text.ini{fill:#fff;font-size:7px;font-weight:700;text-anchor:middle}
.net .rip{fill:none;stroke:var(--c);stroke-width:2.2;opacity:0;transform-box:fill-box;transform-origin:center}
.net .rip.on{opacity:.55}
.net line.talk{stroke:var(--brand);stroke-width:2.4;stroke-dasharray:4 5;opacity:.95}
@media (prefers-reduced-motion: no-preference){
  .net .rip{animation:ripple var(--d,1.6s) ease-out infinite}
  .net line.talk{animation:dash .7s linear infinite}
  @keyframes ripple{0%{transform:scale(.6);opacity:.75}100%{transform:scale(2.1);opacity:0}}
  @keyframes dash{to{stroke-dashoffset:-18}}
}
.net .nd text.lab{fill:var(--muted);font-size:10.5px;text-anchor:middle;font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.net .nd.work text.lab{fill:var(--ink)}
.net line.edge{stroke:var(--muted);opacity:.4}
.flow{display:block;max-width:100%;height:auto;margin:6px auto}
.flowwrap{overflow-x:auto;border:1px solid var(--line);background:var(--surface-2);margin:6px 0}
.flow text{font-family:var(--font);font-size:11.5px;fill:var(--ink)}
.flow .cond{font-size:10px;fill:var(--muted);font-weight:700}
.flow .nodeb{fill:var(--surface);stroke:var(--ink);stroke-width:1}
.flow .nodes{fill:var(--brand)}
.flow .nodes+text{fill:#000;font-weight:700}
.flow path.fe{fill:none;stroke:var(--muted);stroke-width:1.4}
.tip{position:fixed;z-index:60;background:var(--ink);color:var(--bg);padding:4px 9px;font-size:.8em;pointer-events:none;max-width:260px}
details.tbl{margin-top:10px}
details.tbl summary{cursor:pointer;font-weight:600;font-size:.86em}

/* Laptop 1280 bis 1500: kompaktere Abstände, damit Panels Platz behalten */
@media (max-width:1500px){
  body{font-size:13.5px}
  main{gap:12px;padding:12px 16px}
  .top,.bar{padding-left:16px;padding-right:16px}
  .steps li{padding:7px 10px 5px;font-size:.86em}
  .scroll{padding:10px 12px}
}
@media (max-width:1320px){
  main{grid-template-columns:minmax(290px,.8fr) minmax(380px,1.25fr) minmax(380px,1.2fr)}
  .agents{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:8px 10px}
  .agent .nm b{font-size:.74em}
  .brand span{display:none}
  .btn,.opts summary,.seg button{padding:4px 9px}
}
@media (min-width:1700px){
  body{font-size:15px}
  main{grid-template-columns:minmax(380px,.85fr) minmax(520px,1.3fr) minmax(520px,1.2fr);gap:16px;padding:16px 24px}
  .top,.bar{padding-left:24px;padding-right:24px}
}
@media (max-width:1100px){
  html,body{height:auto}
  .app{height:auto;display:block}
  main{grid-template-columns:minmax(0,1fr)}
  .pane{max-height:85vh}
  .ctrls{margin-left:0}
  .agents{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo" id="logoBox">
      <img id="logoImg" alt="Logo" hidden>
      <button type="button" class="logo-ph" id="logoBtn" title="Offizielle Logo-Datei auswählen (SVG oder PNG)">Logo laden</button>
      <input type="file" id="logoFile" accept="image/svg+xml,image/png,image/jpeg" hidden>
    </div>
    <div class="brand"><b>BSI Agent Studio</b><span>Projektteam aus KI-Agenten</span></div>
    <div class="ctrls">
      <div class="seg" role="group" aria-label="Betriebsmodus">
        <button type="button" id="modeLive" aria-pressed="false" title="Live-Modus: Agenten arbeiten über Ihren Server mit einem Sprachmodell">Live</button>
        <button type="button" id="modeReplay" aria-pressed="true">Replay</button>
      </div>
      <div class="seg" role="group" aria-label="Geschwindigkeit" id="speedSeg">
        <button type="button" data-sp="1" aria-pressed="true">1x</button>
        <button type="button" data-sp="2" aria-pressed="false">2x</button>
        <button type="button" data-sp="4" aria-pressed="false">4x</button>
      </div>
      <button type="button" class="btn" id="pauseBtn" disabled>Pause</button>
      <details class="opts" id="opts"><summary>Optionen</summary>
        <div class="panel">
          <label class="chk"><input type="checkbox" id="auto" checked> Kundenantworten automatisch</label>
          <label class="chk"><input type="checkbox" id="follow" checked> Tab folgt dem Geschehen</label>
          <label class="chk"><input type="checkbox" id="tts"> PM spricht vor</label>
          <button type="button" class="btn" id="liveCfgBtn" style="margin-top:6px">Live-Einstellungen</button>
          <button type="button" class="btn" id="logoReset" style="margin-top:6px">Logo entfernen</button>
        </div>
      </details>
      <button type="button" class="btn" id="presBtn" title="Präsentationsmodus (Taste F)">Präsentation</button>
      <button type="button" class="btn" id="themeBtn" title="Hell/Dunkel">Hell/Dunkel</button>
      <button type="button" class="btn primary" id="resetBtn">Neuer Lauf</button>
    </div>
  </header>
  <div class="bar">
    <ol class="steps" id="steps" aria-label="Phasen"></ol>
    <dl class="metrics" id="metrics"></dl>
  </div>
  <main>
    <section class="pane" aria-labelledby="h-auftrag">
      <h2 id="h-auftrag"><span>Auftrag</span><span id="waitHint" class="hint"></span></h2>
      <div class="scroll" id="chat" aria-live="polite"></div>
      <div class="composer">
        <textarea id="inp" aria-label="Anforderung oder Antwort an den Projektmanagement-Agenten" placeholder="Anforderung hier eintippen oder diktieren"></textarea>
        <div class="row">
          <button type="button" class="mic" id="mic" aria-label="Spracheingabe starten oder stoppen" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            Sprechen
          </button>
          <button type="button" class="btn primary" id="send">An PM senden</button>
          <button type="button" class="btn" id="exBtn" title="Anderen Beispieltext einsetzen">Anderes Beispiel</button>
          <span class="hint" id="inpHint"></span>
        </div>
      </div>
    </section>

    <section class="pane" aria-labelledby="h-team">
      <h2 id="h-team"><span>Team</span><span class="hint" id="limitHint"></span></h2>
      <div class="viewhead"><div class="seg sm" id="viewSeg" role="group" aria-label="Teamansicht"><button type="button" data-view="net" aria-pressed="true">Netzwerk</button><button type="button" data-view="cards" aria-pressed="false">Karten</button></div></div>
      <div class="netwrap" id="net"></div>
      <div class="agents" id="agents" hidden></div>
      <div class="filters">
        <label>Agent <select id="fAgent"><option value="">alle</option></select></label>
        <label>Typ <select id="fType"><option value="">alle</option></select></label>
      </div>
      <div class="scroll" id="timeline" aria-live="polite"></div>
    </section>

    <section class="pane" aria-labelledby="h-erg">
      <h2 id="h-erg"><span>Ergebnisse</span></h2>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="scroll" id="results"></div>
    </section>
  </main>
</div>
<dialog id="liveDlg" aria-labelledby="liveH">
  <h3 id="liveH">Live-Modus einrichten</h3>
  <p class="hint">Die Agenten rufen Ihre Edge Function auf. Der Schlüssel des Modellanbieters gehört nur dorthin (als Secret), nie in diese Seite.</p>
  <label>Endpunkt (URL der Funktion)<input id="lcUrl" type="url" placeholder="http://localhost:8787/agent-run" autocomplete="off"></label>

M", "to": "ARCH", "type": "decision", "delayMs": 900, "subject": "Annahme zur Postsystem-Schnittstelle", "body": "Annahme A-003: Das Postsystem bietet eine REST-Schnittstelle mit JSON. Details werden im Projekt geklärt. Bitte so planen, dass die Schnittstelle austauschbar bleibt.", "refs": ["A-003"]}, {"id": "m10", "phase": "anforderungen", "from": "RE", "to": "PO", "type": "artifact", "delayMs": 1800, "subject": "Epics und User Stories (Entwurf)", "body": "2 Epics und 7 Stories erstellt: Self-Service Adressänderung und Prüfung/Freigabe Firmenkunden.", "refs": ["EP-001", "EP-002", "US-001", "US-002", "US-003", "US-004", "US-005", "US-006", "US-007"]}, {"id": "m11", "phase": "anforderungen", "from": "PO", "to": "PM", "type": "decision", "delayMs": 1500, "subject": "Priorisierung und MVP", "body": "MVP (Must): US-001, US-002, US-003, US-004, US-005. Should: US-006 (Postsystem-Übergabe). Could: US-007 (Änderungshistorie für Kunden). Definition of Ready für alle Must-Stories erfüllt.", "refs": ["US-001", "US-006", "US-007"]}, {"id": "m12", "phase": "anforderungen", "from": "PM", "to": "human", "type": "gate", "needsHuman": true, "delayMs": 1000, "subject": "Gate 1: Anforderungsumfang bestätigen", "body": "Das Team schlägt 2 Epics und 7 Stories vor, davon 5 im MVP. Offene Annahmen: A-001 (Privatkunden automatisch, Firmenkunden mit Freigabe), A-002 (nur Portal im ersten Release), A-003 (Postsystem via REST).", "gate": {"id": "gate-1", "options": ["freigeben", "aenderung", "ablehnen"], "autoChoice": "freigeben"}}, {"id": "m13", "phase": "loesungsdesign", "from": "PM", "to": "ARCH", "type": "handoff", "delayMs": 700, "subject": "Auftrag Lösungsdesign", "body": "Anforderungsumfang ist freigegeben. Bitte fachliches und technisches Lösungsdesign inklusive ADRs erstellen."}, {"id": "m14", "phase": "loesungsdesign", "from": "ARCH", "to": "PO", "type": "artifact", "delayMs": 2200, "subject": "Fachliches Lösungsdesign", "body": "Fachlicher Prozess: Adresse erfassen → Kundenform prüfen → bei Privatkunde sofort übernehmen, bei Firmenkunde Aufgabe für Sachbearbeiter → Bestätigung senden → Postsystem informieren.", "refs": ["DES-001", "DES-002"]}, {"id": "m15", "phase": "loesungsdesign", "from": "ARCH", "to": "PM", "type": "artifact", "delayMs": 2200, "subject": "Technisches Lösungsdesign und ADRs", "body": "CRM: Prozess für die Adressänderung mit Verzweigung nach Kundenform. EIP: Interface zur Adressvalidierung und Postsystem-Übergabe. CX: Portalseite im Kundendesign für Formular und Bestätigung. ADR-001: Standardprozess statt Eigenentwicklung. ADR-002: Postsystem-Anbindung über EIP-Interface mit austauschbarem Zielsystem.", "refs": ["DES-003", "DES-004", "DES-005", "ADR-001", "ADR-002"]}, {"id": "m16", "phase": "loesungsdesign", "from": "PM", "to": "human", "type": "gate", "needsHuman": true, "delayMs": 1000, "subject": "Gate 2: Lösungsdesign freigeben", "body": "Das fachliche und technische Design liegt vor. Offene Annahmen sind markiert. Nach Ihrer Freigabe startet die Umsetzung durch die Entwicklungs-Agenten.", "gate": {"id": "gate-2", "options": ["freigeben", "aenderung", "ablehnen"], "autoChoice": "freigeben"}}, {"id": "m17", "phase": "umsetzung", "from": "PM", "to": "DEV_PROCESS", "type": "handoff", "delayMs": 600, "subject": "Umsetzung Prozess", "body": "Bitte die Prozesse gemäß DES-003 erstellen.", "refs": ["DES-003"]}, {"id": "m18", "phase": "umsetzung", "from": "PM", "to": "DEV_EIP", "type": "handoff", "delayMs": 300, "subject": "Umsetzung Schnittstelle", "body": "Bitte das Interface gemäß DES-004 und ADR-002 erstellen.", "refs": ["DES-004", "ADR-002"]}, {"id": "m19", "phase": "umsetzung", "from": "PM", "to": "DEV_CX", "type": "handoff", "delayMs": 300, "subject": "Umsetzung Kundendesign", "body": "Bitte die Portalseiten gemäß DES-005 im Kundendesign erstellen.", "refs": ["DES-005"]}, {"id": "m20", "phase": "umsetzung", "from": "DEV_PROCESS", "to": "QA", "type": "artifact", "delayMs": 2400, "subject": "Prozess-Artefakte", "body": "3 Prozesse erstellt: Adressänderung Hauptprozess, Prüfung Firmenkunde, Bestätigung versenden.", "refs": ["ART-process-001", "ART-process-002", "ART-process-003"]}, {"id": "m21", "phase": "umsetzung", "from": "DEV_EIP", "to": "QA", "type": "artifact", "delayMs": 1800, "subject": "EIP-Interface", "body": "Interface 'Adresse an Postsystem' erstellt: Eingang aus CRM, Validierung, REST-Aufruf, Fehlerbehandlung mit Wiederholung.", "refs": ["ART-eip-001"]}, {"id": "m22", "phase": "umsetzung", "from": "DEV_CX", "to": "QA", "type": "artifact", "delayMs": 1800, "subject": "Kundendesign Portal", "body": "Design-Anpassung erstellt: Formularseite und Bestätigungsseite mit Kundenfarben, Schrift und Footer.", "refs": ["ART-cx-001"]}, {"id": "m23", "phase": "qa", "from": "QA", "to": "PM", "type": "finding", "delayMs": 1800, "subject": "QA-Befund", "body": "Befund F-001 (mittel): Im Prozess 'Prüfung Firmenkunde' fehlt der Ausgang für 'Sachbearbeiter lehnt ab'. Der Prozess würde in einer Sackgasse enden. Alle anderen Akzeptanzkriterien sind erfüllt.", "refs": ["F-001", "ART-process-002", "US-004"]}, {"id": "m24", "phase": "qa", "from": "PM", "to": "DEV_PROCESS", "type": "handoff", "delayMs": 700, "subject": "Korrektur F-001", "body": "Bitte Ablehnungsausgang mit Benachrichtigung des Kunden ergänzen.", "refs": ["F-001"]}, {"id": "m25", "phase": "qa", "from": "DEV_PROCESS", "to": "QA", "type": "artifact", "delayMs": 1600, "subject": "Korrigierter Prozess", "body": "Ausgang 'Abgelehnt' mit Benachrichtigung ergänzt.", "refs": ["ART-process-002"]}, {"id": "m26", "phase": "qa", "from": "QA", "to": "PM", "type": "info", "delayMs": 1200, "subject": "QA abgeschlossen", "body": "Alle Must-Stories sind abgedeckt. Schema-Prüfung der Demo-Artefakte bestanden. Hinweis: Echte Importvalidierung gegen die BSI Customer Suite steht noch aus.", "refs": ["F-001"]}, {"id": "m27", "phase": "export", "from": "PM", "to": "human", "type": "info", "delayMs": 1000, "subject": "Ergebnis bereit", "body": "Das Team hat Anforderungen, Lösungsdesign und Artefakte erarbeitet. Ein Befund wurde gefunden und behoben. Das Export-Paket enthält Dokumentation, Traceability und die Artefakte für Prozess, EIP und CX-Design. Status aller Artefakte: 'demo', eine Importvalidierung steht noch aus."}], "assumptions": [{"id": "A-001", "text": "Privatkunden: Adressänderung wird automatisch wirksam. Firmenkunden: Freigabe durch Sachbearbeiter.", "source": "Kunde (m08)"}, {"id": "A-002", "text": "Erstes Release nur für das Kundenportal, Zieltermin Q1.", "source": "Kunde (m08)"}, {"id": "A-003", "text": "Das Postsystem bietet eine REST-Schnittstelle mit JSON; Details sind im Projekt zu klären.", "source": "PM-Annahme (m09)"}], "artifacts": {"requirements": [{"id": "REQ-001", "text": "Kunden können ihre Adresse im Portal selbst ändern."}, {"id": "REQ-002", "text": "Adressänderungen werden fachlich geprüft, bei Firmenkunden strenger."}, {"id": "REQ-003", "text": "Kunden erhalten nach der Änderung eine Bestätigung."}, {"id": "REQ-004", "text": "Geänderte Adressen werden an das Postsystem übergeben."}], "epics": [{"id": "EP-001", "title": "Self-Service Adressänderung", "reqs": ["REQ-001", "REQ-003", "REQ-004"]}, {"id": "EP-002", "title": "Prüfung und Freigabe Firmenkunden", "reqs": ["REQ-002"]}], "stories": [{"id": "US-001", "epic": "EP-001", "priority": "Must", "title": "Adresse im Portal ändern", "story": "Als Kunde möchte ich meine Adresse im Portal ändern, damit ich nicht im Service anrufen muss.", "ac": ["Given ich bin angemeldet, When ich eine gültige Adresse speichere, Then wird die Änderung entgegengenommen.", "Given ich gebe eine unvollständige Adresse ein, When ich speichere, Then sehe ich eine verständliche Fehlermeldung."], "reqs": ["REQ-001"]}, {"id": "US-002", "epic": "EP-001", "priority": "Must", "title": "Adresse validieren", "story": "Als Versicherer möchte ich Adressen validieren, damit keine ungültigen Anschriften gespeichert werden.", "ac": ["Given eine Adresse mit unbekannter Straße, When ich speichere, Then erhalte ich einen Korrekturvorschlag."], "reqs": ["REQ-002"]}, {"id": "US-003", "epic": "EP-001", "priority": "Must", "title": "Privatkunden: sofort wirksam", "story": "Als Privatkunde möchte ich, dass meine Änderung sofort gilt, damit ich nicht warten muss.", "ac": ["Given Kundenform Privatperson, When die Adresse gültig ist, Then wird sie ohne Freigabe übernommen."], "reqs": ["REQ-002"]}, {"id": "US-004", "epic": "EP-002", "priority": "Must", "title": "Firmenkunden: Freigabe", "story": "Als Sachbearbeiter möchte ich Adressänderungen von Firmenkunden prüfen, damit Betrug und Fehler vermieden werden.", "ac": ["Given Kundenform Organisation, When die Adresse gespeichert wird, Then entsteht eine Prüfaufgabe.", "Given ich lehne ab, When ich bestätige, Then wird der Kunde benachrichtigt."], "reqs": ["REQ-002"]}, {"id": "US-005", "epic": "EP-001", "priority": "Must", "title": "Bestätigung an Kunden", "story": "Als Kunde möchte ich eine Bestätigung erhalten, damit ich weiß, dass die Änderung gilt.", "ac": ["Given die Änderung ist wirksam, When der Prozess endet, Then erhalte ich eine Bestätigung."], "reqs": ["REQ-003"]}, {"id": "US-006", "epic": "EP-001", "priority": "Should", "title": "Übergabe an Postsystem", "story": "Als Versicherer möchte ich die neue Adresse an das Postsystem übergeben, damit Post korrekt zugestellt wird.", "ac": ["Given eine wirksame Änderung, When der Prozess endet, Then wird die Adresse an das Postsystem gesendet.", "Given das Postsystem antwortet nicht, When ein Fehler auftritt, Then wird der Aufruf wiederholt und protokolliert."], "reqs": ["REQ-004"]}, {"id": "US-007", "epic": "EP-001", "priority": "Could", "title": "Änderungshistorie", "story": "Als Kunde möchte ich meine früheren Adressen sehen, damit ich Änderungen nachvollziehen kann.", "ac": ["Given ich habe Änderungen vorgenommen, When ich die Historie öffne, Then sehe ich alle Änderungen mit Datum."], "reqs": ["REQ-001"]}], "design": [{"id": "DES-001", "kind": "fachlich", "title": "Fachlicher Prozess Adressänderung", "text": "Adresse erfassen, Kundenform prüfen, Privatkunde: übernehmen; Firmenkunde: Prüfaufgabe, danach übernehmen oder ablehnen; Bestätigung senden; Postsystem informieren.", "stories": ["US-001", "US-003", "US-004", "US-005"]}, {"id": "DES-002", "kind": "fachlich", "title": "Datenobjekte und Rollen", "text": "Kunde (Privatperson/Organisation), Adresse mit Gültigkeit und Quelle, Aufgabe Sachbearbeiter. Rollen: Kunde, Sachbearbeiter.", "stories": ["US-002", "US-007"]}, {"id": "DES-003", "kind": "technisch", "title": "CRM-Prozessmodell", "text": "Hauptprozess mit Verzweigung nach Kundenform, Unterprozess Prüfung Firmenkunde, Unterprozess Bestätigung.", "stories": ["US-003", "US-004", "US-005"]}, {"id": "DES-004", "kind": "technisch", "title": "EIP-Interface Postsystem", "text": "Eingang aus CRM, Validierung, REST-Aufruf mit Wiederholung und Fehlerprotokoll. Zielsystem konfigurierbar.", "stories": ["US-002", "US-006"]}, {"id": "DES-005", "kind": "technisch", "title": "CX-Portalseiten", "text": "Formularseite und Bestätigungsseite im Kundendesign, barrierearm.", "stories": ["US-001", "US-005"]}], "adrs": [{"id": "ADR-001", "title": "Standardprozess statt Eigenentwicklung", "context": "Adressänderung mit Verzweigung und Aufgaben ist mit Standardmitteln abbildbar.", "decision": "Umsetzung als CRM-Prozess mit Standard-Schritten.", "consequences": "Geringer Wartungsaufwand, Releasefähigkeit bleibt erhalten."}, {"id": "ADR-002", "title": "Postsystem-Anbindung über EIP-Interface", "context": "Details der Postsystem-Schnittstelle sind unbekannt (Annahme A-003).", "decision": "Anbindung über ein EIP-Interface mit austauschbarem Zielsystem.", "consequences": "Änderungen an der Schnittstelle bleiben lokal, Annahme muss früh verifiziert werden."}], "bsiArtifacts": [{"id": "ART-process-001", "type": "process", "status": "demo", "title": "Adressänderung Hauptprozess", "steps": ["Start", "Adresse erfassen", "Kundenform prüfen", "[Privatperson] Adresse übernehmen", "[Organisation] Prüfung Firmenkunde", "Bestätigung versenden", "Postsystem informieren", "Ende"], "designRefs": ["DES-003"]}, {"id": "ART-process-002", "type": "process", "status": "demo", "title": "Prüfung Firmenkunde", "steps": ["Start", "Aufgabe für Sachbearbeiter", "[Freigegeben] Adresse übernehmen", "[Abgelehnt] Kunden benachrichtigen", "Ende"], "designRefs": ["DES-003"]}, {"id": "ART-process-003", "type": "process", "status": "demo", "title": "Bestätigung versenden", "steps": ["Start", "Korrespondenz erstellen", "Versand", "Ende"], "designRefs": ["DES-003"]}, {"id": "ART-eip-001", "type": "eip", "status": "demo", "title": "Adresse an Postsystem", "steps": ["Trigger aus CRM", "Adresse validieren", "REST-Aufruf Postsystem", "Fehlerbehandlung mit Wiederholung", "Protokoll"], "designRefs": ["DES-004"]}, {"id": "ART-cx-001", "type": "cx-design", "status": "demo", "title": "Portal Formular und Bestätigung", "tokens": {"primary": "#1f4e79", "accent": "#e07b00", "font": "Inter"}, "designRefs": ["DES-005"]}], "findings": [{"id": "F-001", "severity": "mittel", "artifact": "ART-process-002", "text": "Ausgang 'Abgelehnt' fehlte, Prozess endete in einer Sackgasse.", "status": "behoben"}]}}, "energie": {"schemaVersion": "1.0", "id": "replay-energie-zaehlerstand", "title": "Energieversorger: Zählerstand per Portal erfassen und an die Abrechnung übergeben", "scenario": "energie", "language": "de", "note": "Fiktives Szenario. Alle Artefakte haben Status 'demo' und sind keine echten BSI-Importformate.", "agents": [{"id": "PM", "name": "Projektmanagement", "color": "#2563eb"}, {"id": "RE", "name": "Requirements-Engineer", "color": "#7c3aed"}, {"id": "PO", "name": "Product Owner", "color": "#ea580c"}, {"id": "ARCH", "name": "IT-Architekt", "color": "#16a34a"}, {"id": "DEV_PROCESS", "name": "Process-Agent", "color": "#0d9488"}, {"id": "DEV_EIP", "name": "EIP-Agent", "color": "#0d9488"}, {"id": "DEV_CX", "name": "CX-Design-Agent", "color": "#0d9488"}, {"id": "QA", "name": "QA-Agent", "color": "#9a3412"}], "phases": ["intake", "klaerung", "anforderungen", "loesungsdesign", "umsetzung", "qa", "export"], "messages": [{"id": "m01", "phase": "intake", "from": "human", "to": "PM", "type": "info", "delayMs": 800, "subject": "Anforderung des Kunden", "body": "Unsere Kunden sollen jährlich ihren Zählerstand für Strom und Gas selbst im Portal melden können. Bisher kommen die Werte per Postkarte oder Anruf. Auffällige Werte müssen geprüft werden, bevor sie in die Abrechnung gehen. Die Werte sollen automatisch an unser Abrechnungssystem übergeben werden, und Kunden sollen vorher an die Ablesung erinnert werden."}, {"id": "m02", "phase": "intake", "from": "PM", "to": "human", "type": "answer", "delayMs": 1200, "subject": "Rückfassung", "body": "Ich habe verstanden: Kunden melden Zählerstände für Strom und Gas im Portal. Auffällige Werte werden vor der Abrechnung geprüft, gültige Werte automatisch an das Abrechnungssystem übergeben. Zusätzlich sollen Kunden vorab an die Ablesung erinnert werden. Ich lasse das Team die Lücken sammeln und melde mich mit gebündelten Rückfragen."}, {"id": "m03", "phase": "klaerung", "from": "PM", "to": "RE", "type": "handoff", "delayMs": 800, "subject": "Anforderung zur Strukturierung", "body": "Bitte strukturiere die Anforderung in Epics und Stories und nenne alle fachlichen Lücken."}, {"id": "m04", "phase": "klaerung", "from": "RE", "to": "PM", "type": "question", "delayMs": 1500, "subject": "Lücken in der Anforderung", "body": "Offen sind: (1) Was gilt als 'auffällig', gibt es eine Toleranzgrenze gegenüber dem Vorjahresverbrauch? (2) Wer klärt auffällige Werte, ein Sachbearbeiter oder der Kunde selbst? (3) Gilt das auch für Wasser oder Fernwärme? (4) Wie läuft die Erinnerung ab, E-Mail, SMS oder beides, und wann?", "refs": ["REQ-001"]}, {"id": "m05", "phase": "klaerung", "from": "PO", "to": "PM", "type": "question", "delayMs": 1000, "subject": "Fragen zu Umfang und Termin", "body": "Gehört die Erinnerung zum ersten Release oder kommt sie später? Gibt es einen festen Ablesezeitraum, bis zu dem alles laufen muss?"}, {"id": "m06", "phase": "klaerung", "from": "ARCH", "to": "PM", "type": "question", "delayMs": 1000, "subject": "Technische Rahmenbedingungen", "body": "Welche Schnittstelle bietet das Abrechnungssystem für Zählerstände (REST, Datei, Queue)? Wird ein Zählerstand dort bei erneuter Übermittlung überschrieben oder doppelt angelegt?"}, {"id": "m07", "phase": "klaerung", "from": "PM", "to": "human", "type": "question", "needsHuman": true, "delayMs": 1400, "subject": "Gebündelte Rückfragen (Runde 1)", "body": "Drei Themen brauchen Ihre Entscheidung:\n1. Plausibilität: Soll ein Wert als auffällig gelten, wenn er mehr als 30 % vom Vorjahresverbrauch abweicht oder niedriger als der letzte Stand ist? Und soll ein Sachbearbeiter solche Fälle klären?\n2. Umfang und Termin: Reichen im ersten Release Strom und Gas im Portal, mit Erinnerung per E-Mail? Gibt es einen festen Termin?\n3. Abrechnungssystem: Welche Schnittstelle bietet es? Falls unbekannt, treffe ich eine Annahme.", "refs": ["Q-001", "Q-002", "Q-003"]}, {"id": "m08", "phase": "klaerung", "from": "human", "to": "PM", "type": "answer", "delayMs": 1500, "subject": "Antworten des Kunden", "body": "Ja, 30 Prozent und niedriger als der letzte Stand sind auffällig, ein Sachbearbeiter klärt das. Erstes Release nur Strom und Gas, Erinnerung per E-Mail, Start zur nächsten Ablesesaison im Herbst. Das Abrechnungssystem hat eine REST-Schnittstelle, Details kennen wir noch nicht."}, {"id": "m09", "phase": "klaerung", "from": "PM", "to": "ARCH", "type": "decision", "delayMs": 900, "subject": "Annahme zur Abrechnungs-Schnittstelle", "body": "Annahme A-003: Das Abrechnungssystem bietet eine REST-Schnittstelle mit JSON. Ob Zählerstände dort idempotent angenommen werden, ist offen. Bitte so planen, dass die Schnittstelle austauschbar bleibt und Fehlversuche kontrolliert wiederholt werden können.", "refs": ["A-003"]}, {"id": "m10", "phase": "anforderungen", "from": "RE", "to": "PO", "type": "artifact", "delayMs": 1800, "subject": "Epics und User Stories (Entwurf)", "body": "2 Epics und 7 Stories erstellt: Zählerstandserfassung im Portal und Plausibilisierung mit Übergabe an die Abrechnung.", "refs": ["EP-001", "EP-002", "US-001", "US-002", "US-003", "US-004", "US-005", "US-006", "US-007"]}, {"id": "m11", "phase": "anforderungen", "from": "PO", "to": "PM", "type": "decision", "delayMs": 1500, "subject": "Priorisierung und MVP", "body": "MVP (Must): US-001 bis US-005. Should: US-006 (Erinnerung per E-Mail). Could: US-007 (Verbrauchshistorie). Definition of Ready für alle Must-Stories erfüllt.", "refs": ["US-001", "US-006", "US-007"]}, {"id": "m12", "phase": "anforderungen", "from": "PM", "to": "human", "type": "gate", "needsHuman": true, "delayMs": 1000, "subject": "Gate 1: Anforderungsumfang bestätigen", "body": "Das Team schlägt 2 Epics und 7 Stories vor, davon 5 im MVP. Offene Annahmen: A-001 (Auffälligkeit ab 30 % Abweichung oder niedrigerem Stand, Klärung durch Sachbearbeiter), A-002 (Strom und Gas, Erinnerung per E-Mail), A-003 (Abrechnungssystem via REST).", "gate": {"id": "gate-1", "options": ["freigeben", "aenderung", "ablehnen"], "autoChoice": "freigeben"}}, {"id": "m13", "phase": "loesungsdesign", "from": "PM", "to": "ARCH", "type": "handoff", "delayMs": 700, "subject": "Auftrag Lösungsdesign", "body": "Anforderungsumfang ist freigegeben. Bitte fachliches und technisches Lösungsdesign inklusive ADRs erstellen."}, {"id": "m14", "phase": "loesungsdesign", "from": "ARCH", "to": "PO", "type": "artifact", "delayMs": 2200, "subject": "Fachliches Lösungsdesign", "body": "Fachlicher Ablauf: Zählerstand erfassen → Plausibilität prüfen → bei unauffälligem Wert an die Abrechnung übergeben, bei Auffälligkeit Klärungsaufgabe für Sachbearbeiter → Bestätigung an den Kunden. Erinnerung vor Ablesesaison als eigener Anstoß.", "refs": ["DES-001", "DES-002"]}, {"id": "m15", "phase": "loesungsdesign", "from": "ARCH", "to": "PM", "type": "artifact", "delayMs": 2200, "subject": "Technisches Lösungsdesign und ADRs", "body": "CRM: Prozess zur Zählerstandserfassung mit Plausibilitätsverzweigung. EIP: Interface zur Übergabe an das Abrechnungssystem mit Fehlerbehandlung. CX: Portalseite im Kundendesign für Erfassung und Bestätigung. ADR-001: Plausibilitätsregeln als konfigurierbare Parameter statt fester Logik. ADR-002: Abrechnungsanbindung über EIP-Interface mit austauschbarem Zielsystem.", "refs": ["DES-003", "DES-004", "DES-005", "ADR-001", "ADR-002"]}, {"id": "m16", "phase": "loesungsdesign", "from": "PM", "to": "human", "type": "gate", "needsHuman": true, "delayMs": 1000, "subject": "Gate 2: Lösungsdesign freigeben", "body": "Das fachliche und technische Design liegt vor. Offene Annahmen sind markiert. Nach Ihrer Freigabe startet die Umsetzung durch die Entwicklungs-Agenten.", "gate": {"id": "gate-2", "options": ["freigeben", "aenderung", "ablehnen"], "autoChoice": "freigeben"}}, {"id": "m17", "phase": "umsetzung", "from": "PM", "to": "DEV_PROCESS", "type": "handoff", "delayMs": 600, "subject": "Umsetzung Prozess", "body": "Bitte die Prozesse gemäß DES-003 erstellen.", "refs": ["DES-003"]}, {"id": "m18", "phase": "umsetzung", "from": "PM", "to": "DEV_EIP", "type": "handoff", "delayMs": 300, "subject": "Umsetzung Schnittstelle", "body": "Bitte das Interface gemäß DES-004 und ADR-002 erstellen.", "refs": ["DES-004", "ADR-002"]}, {"id": "m19", "phase": "umsetzung", "from": "PM", "to": "DEV_CX", "type": "handoff", "delayMs": 300, "subject": "Umsetzung Kundendesign", "body": "Bitte die Portalseiten gemäß DES-005 im Kundendesign erstellen.", "refs": ["DES-005"]}, {"id": "m20", "phase": "umsetzung", "from": "DEV_PROCESS", "to": "QA", "type": "artifact", "delayMs": 2400, "subject": "Prozess-Artefakte", "body": "3 Prozesse erstellt: Zählerstand erfassen (Hauptprozess), Klärung auffälliger Wert, Bestätigung versenden.", "refs": ["ART-process-001", "ART-process-002", "ART-process-003"]}, {"id": "m21", "phase": "umsetzung", "from": "DEV_EIP", "to": "QA", "type": "artifact", "delayMs": 1800, "subject": "EIP-Interface", "body": "Interface 'Zählerstand an Abrechnung' erstellt: Eingang aus CRM, Format prüfen, REST-Aufruf, Fehlerbehandlung mit Wiederholung, Protokoll.", "refs": ["ART-eip-001"]}, {"id": "m22", "phase": "umsetzung", "from": "DEV_CX", "to": "QA", "type": "artifact", "delayMs": 1800, "subject": "Kundendesign Portal", "body": "Design-Anpassung erstellt: Erfassungsseite und Bestätigungsseite mit Kundenfarben, Schrift und Footer.", "refs": ["ART-cx-001"]}, {"id": "m23", "phase": "qa", "from": "QA", "to": "PM", "type": "finding", "delayMs": 1800, "subject": "QA-Befund", "body": "Befund F-001 (hoch): Das Interface 'Zählerstand an Abrechnung' wiederholt Fehlversuche, enthält aber keinen Duplikatsschutz. Bei Wiederholung nach einem Timeout könnte derselbe Zählerstand doppelt in der Abrechnung ankommen. Alle anderen Akzeptanzkriterien sind erfüllt.", "refs": ["F-001", "ART-eip-001", "US-004"]}, {"id": "m24", "phase": "qa", "from": "PM", "to": "DEV_EIP", "type": "handoff", "delayMs": 700, "subject": "Korrektur F-001", "body": "Bitte einen Duplikatsschutz ergänzen, etwa über eine eindeutige Kennung aus Zähler und Ablesedatum.", "refs": ["F-001"]}, {"id": "m25", "phase": "qa", "from": "DEV_EIP", "to": "QA", "type": "artifact", "delayMs": 1600, "subject": "Korrigiertes Interface", "body": "Duplikatsprüfung über Zähler-ID und Ablesedatum ergänzt, bereits übermittelte Werte werden protokolliert und nicht erneut gesendet.", "refs": ["ART-eip-001"]}, {"id": "m26", "phase": "qa", "from": "QA", "to": "PM", "type": "info", "delayMs": 1200, "subject": "QA abgeschlossen", "body": "Alle Must-Stories sind abgedeckt. Schema-Prüfung der Demo-Artefakte bestanden. Hinweis: Echte Importvalidierung gegen die BSI Customer Suite steht noch aus.", "refs": ["F-001"]}, {"id": "m27", "phase": "export", "from": "PM", "to": "human", "type": "in : ["Given die Ablesesaison beginnt, When ich noch keinen Wert gemeldet habe, Then erhalte ich eine E-Mail-Erinnerung."], "reqs": ["REQ-004"]}, {"id": "US-007", "epic": "EP-001", "priority": "Could", "title": "Verbrauchshistorie", "story": "Als Kunde möchte ich meine früheren Zählerstände sehen, damit ich meinen Verbrauch nachvollziehen kann.", "ac": ["Given ich habe Werte gemeldet, When ich die Historie öffne, Then sehe ich alle Werte mit Datum."], "reqs": ["REQ-001"]}], "design": [{"id": "DES-001", "kind": "fachlich", "title": "Fachlicher Ablauf Zählerstandsmeldung", "text": "Zählerstand erfassen, Plausibilität prüfen, unauffällig: an Abrechnung übergeben; auffällig: Klärungsaufgabe für Sachbearbeiter, danach freigeben oder korrigieren; Bestätigung senden.", "stories": ["US-001", "US-002", "US-003", "US-005"]}, {"id": "DES-002", "kind": "fachlich", "title": "Datenobjekte und Rollen", "text": "Kunde, Zähler (Strom/Gas), Zählerstand mit Ablesedatum und Quelle, Klärungsaufgabe. Rollen: Kunde, Sachbearbeiter.", "stories": ["US-006", "US-007"]}, {"id": "DES-003", "kind": "technisch", "title": "CRM-Prozessmodell", "text": "Hauptprozess mit Verzweigung nach Plausibilitätsergebnis, Unterprozess Klärung auffälliger Wert, Unterprozess Bestätigung.", "stories": ["US-002", "US-003", "US-005"]}, {"id": "DES-004", "kind": "technisch", "title": "EIP-Interface Abrechnungssystem", "text": "Eingang aus CRM, Formatprüfung, REST-Aufruf mit Wiederholung und Protokoll. Zielsystem konfigurierbar.", "stories": ["US-004"]}, {"id": "DES-005", "kind": "technisch", "title": "CX-Portalseiten", "text": "Erfassungsseite und Bestätigungsseite im Kundendesign, barrierearm.", "stories": ["US-001", "US-005"]}], "adrs": [{"id": "ADR-001", "title": "Plausibilitätsregeln als Parameter", "context": "Schwellenwerte wie 30 % Abweichung können sich ändern und unterscheiden sich je Sparte.", "decision": "Regeln werden als konfigurierbare Parameter hinterlegt, nicht fest in den Prozess eingebaut.", "conseque <script>
"use strict";
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const MSG_LIMIT = 40;

const PHASE_LABEL = {intake:"Intake",klaerung:"Klärung",anforderungen:"Anforderungen",loesungsdesign:"Lösungsdesign",umsetzung:"Umsetzung",qa:"QA",export:"Export"};
const TYPE_LABEL = {info:"Info",question:"Frage",answer:"Antwort",decision:"Entscheidung",artifact:"Artefakt",handoff:"Übergabe",gate:"Freigabe",finding:"Befund"};
const SHORT = {PM:"PM",RE:"RE",PO:"PO",ARCH:"AR",DEV_PROCESS:"PR",DEV_EIP:"EI",DEV_CX:"CX",QA:"QA",human:"K"};
const TABS = [
  ["ov","Überblick"],["req","Anforderungen"],["stories","User Stories"],["fach","Fachlich"],["tech","Technisch"],
  ["adr","ADRs"],["bsi","BSI-Artefakte"],["ann","Annahmen"],["trace","Traceability"],["export","Export"]
];
const SCN_LABEL = {versicherung:"Versicherung: Adressänderung", energie:"Energie: Zählerstand"};

let R, AG, S, runId = 0, rec = null, MODE = "replay", L = null, EXI = 0;
const PM_NAME = "Ben D. (PM)";

/* ---------- Hilfen ---------- */
function toast(t){
  const el=document.createElement("div"); el.className="toast"; el.textContent=t;
  $("#toastHost").appendChild(el); setTimeout(()=>el.remove(), 4200);
}
function agentOf(id){ return AG[id] || {id, name:id, color:"#555"}; }
const BODY = "M4 29V22C4 17.5 8 15.5 12 15.5H20C24 15.5 28 17.5 28 22V29Z";
function av(id){ const a=agentOf(id); return `<span class="av" style="--c:${esc(a.color)}" title="${esc(a.name)}"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="9" r="6.5"/><path d="${BODY}"/></svg></span>`; }
function fmtTime(s){ const m=Math.floor(s/60), r=Math.floor(s%60); return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0"); }

/* ---------- Zustand ---------- */
function freshState(scn){
  return {scn, idx:0, started:false, ended:false, rejected:false, paused:false, speed:S?S.speed:1,
    shown:[], phase:null, wait:"user-start", pending:null, tm:null, typer:null,
    working:null, view:S?S.view:"net", pulse:null, tab:S?S.tab:"ov", changes:[], elapsed:0, gateNote:false, resetArmed:false};
}
function init(scn){
  runId++; clearTimeout(S && S.tm); clearInterval(S && S.typer);
  if(rec){ try{rec.stop();}catch(e){} }
  R = MODE==="live" ? makeLiveRun(window.REPLAYS[scn]) : window.REPLAYS[scn];
  R.agents = R.agents.map(a=>a.id==="PM" ? Object.assign({}, a, {name:PM_NAME}) : a);
  AG = {}; R.agents.forEach(a=>AG[a.id]=a); AG.human = {id:"human",name:"Kunde (Mensch)",color:"#475569"};
  S = freshState(scn); S.live = MODE==="live"; S.busy = null;
  L = {step:0, n:0, err:null, cfg:loadCfg(), info:(L&&L.info)||null};
  $("#inp").value = exampleList()[EXI % exampleList().length];
  buildFilters(); renderAll();
}

/* ---------- Ableitungen aus gezeigten Nachrichten ---------- */
function derived(){
  const refs = new Set(), ids = new Set(), art = {};
  S.shown.forEach(m=>{ ids.add(m.id); (m.refs||[]).forEach(r=>refs.add(r));
    if(m.type==="artifact") (m.refs||[]).forEach(r=>{ art[r]=(art[r]||0)+1; }); });
  const A = R.artifacts;
  const epics = A.epics.filter(e=>refs.has(e.id));
  const reqIds = new Set(); epics.forEach(e=>e.reqs.forEach(r=>reqIds.add(r)));
  refs.forEach(r=>{ if(/^REQ-/.test(r)) reqIds.add(r); });
  const prio = S.shown.some(m=>m.phase==="anforderungen" && m.type==="decision");
  const assumptions = R.assumptions.filter(a=>{
    if(refs.has(a.id)) return true;
    const mm = /m\d+/.exec(a.source||""); return mm && ids.has(mm[0]);
  });
  const resolved = f => S.shown.some(m=>m.phase==="qa" && m.type==="artifact" && (m.refs||[]).includes(f.artifact));
  return {
    refs, prio, assumptions,
    reqs: A.requirements.filter(r=>reqIds.has(r.id)),
    epics,
    stories: A.stories.filter(s=>refs.has(s.id)),
    design: A.design.filter(d=>refs.has(d.id)),
    adrs: A.adrs.filter(d=>refs.has(d.id)),
    arts: A.bsiArtifacts.filter(a=>refs.has(a.id)),
    findings: A.findings.filter(f=>refs.has(f.id)).map(f=>Object.assign({}, f, {resolved: resolved(f)})),
    artVersion: id => art[id] || 1
  };
}

/* ---------- Rendering ---------- */
function renderAll(){ renderControls(); renderSteps(); renderMetrics(); renderAgents(); renderTimeline(); renderChat(); renderTabs(); renderResults(); renderComposer(); }

function renderControls(){
  document.querySelectorAll("#viewSeg button").forEach(b=>b.addEventListener("click", ()=>{ S.view=b.dataset.view; renderAgents(); }));
document.querySelectorAll("#speedSeg button").forEach(b=>b.setAttribute("aria-pressed", String(+b.dataset.sp===S.speed)));
  const pb=$("#pauseBtn"); pb.disabled = !S.started || S.ended; pb.textContent = S.paused?"Weiter":"Pause";
  $("#modeLive").setAttribute("aria-pressed", String(MODE==="live")); $("#modeReplay").setAttribute("aria-pressed", String(MODE!=="live"));
  $("#resetBtn").textContent = S.resetArmed?"Wirklich zurücksetzen?":"Neuer Lauf";
}

function renderSteps(){
  const cur = S.phase ? R.phases.indexOf(S.phase) : -1;
  $("#steps").innerHTML = R.phases.map((p,i)=>{
    const st = S.ended && !S.rejected ? "done" : (i<cur?"done":(i===cur?"active":""));
    return `<li class="${st}" ${st==="active"?'aria-current="step"':''}><span class="dot"></span>${esc(PHASE_LABEL[p]||p)}</li>`;
  }).join("");
}

function renderMetrics(){
  const d = derived();
  const rows = [
    ["Laufzeit", fmtTime(S.elapsed)],
    ["Nachrichten", S.shown.length+" / "+MSG_LIMIT],
    ["Stories", d.stories.length],
    ["Artefakte", d.arts.length],
    ["Rückfragen", S.shown.filter(m=>m.type==="question" && m.to==="human").length],
    ["Annahmen", d.assumptions.length+S.changes.length]
  ];
  $("#metrics").innerHTML = rows.map(r=>`<div><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join("");
  $("#limitHint").textContent = S.shown.length+" von max. "+MSG_LIMIT+" Nachrichten";
}

function shortName(n){
  return esc(n).replace("Projektmanagement","Projekt&shy;management").replace("Requirements-Engineer","Requirements-<wbr>Engineer").replace("Process-Agent","Process-<wbr>Agent").replace("CX-Design-Agent","CX-Design-<wbr>Agent");
}
const NET = {
  human:{x:46,y:125,l:"Kunde"}, PM:{x:172,y:125,l:"Ben D. (PM)"},
  RE:{x:312,y:42,l:"Requirements"}, PO:{x:312,y:125,l:"Product Owner"}, ARCH:{x:312,y:208,l:"Architekt"},
  DEV_PROCESS:{x:452,y:42,l:"Prozess"}, DEV_EIP:{x:452,y:125,l:"EIP"}, DEV_CX:{x:452,y:208,l:"CX-Design"},
  QA:{x:594,y:125,l:"QA"}
};
function renderNet(sent){
  const edges = {};
  S.shown.forEach(m=>{ if(NET[m.from]&&NET[m.to]){ const k=[m.from,m.to].sort().join("|"); edges[k]=(edges[k]||0)+1; } });
  let g = "";
  Object.keys(edges).forEach(k=>{
    const [a,b]=k.split("|"), A=NET[a], B=NET[b];
    const dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L, r=22;
    g += `<line class="edge" x1="${A.x+ux*r}" y1="${A.y+uy*r}" x2="${B.x-ux*r}" y2="${B.y-uy*r}" stroke-width="${(1+Math.min(edges[k],5)*0.5).toFixed(1)}"/>`;
  });
  const last = S.shown[S.shown.length-1];
  if(S.working && last && NET[last.from] && NET[last.to] && !reduce){
    const A=NET[last.from], B=NET[last.to];
    g += `<circle r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"><animateMotion dur="${(0.9/S.speed).toFixed(2)}s" path="M${A.x} ${A.y} L${B.x} ${B.y}" fill="freeze"/></circle>`;
  }
  const talk = (S.working && last && NET[last.from] && NET[last.to] && S.working===last.from) ? last : null;

  const d = (1.6/S.speed).toFixed(2)+"s";

  });

}

/* ---------- Widgets ---------- */
function wrapText(t, n){
  const words = String(t).split(/\s+/), lines = []; let cur = "";
  words.forEach(w=>{ if((cur+" "+w).trim().length>n && cur){ lines.push(cur); cur=w; } else cur=(cur+" "+w).trim(); });
  if(cur) lines.push(cur); return lines.slice(0,3);
}
function flowSvg(steps){
  const items=[]; let i=0;
  while(i<steps.length){
    if(/^\[/.test(steps[i])){
      const g=[]; while(i<steps.length && /^\[/.test(steps[i])){ const m=/^\[([^\]]+)\]\s*(.*)$/.exec(steps[i]); g.push({label:m[1],text:m[2]}); i++; }
      items.push({b:g});
    } else { items.push({t:steps[i]}); i++; }
  }
  const NW=156, NH=40, GAP=36, maxB=Math.max(1,...items.map(x=>x.b?x.b.length:1));
  const W=Math.max(300, maxB*(NW+16)+16);
  let y=10, prev=null; const nodes=[], edges=[];
  items.forEach(it=>{
    const row = it.b ? it.b.map((b,k)=>({x:W/2+(k-(it.b.length-1)/2)*(NW+16), text:b.text, label:b.label}))
                     : [{x:W/2, text:it.t}];
    const top = y + (it.b?14:0);
    row.forEach(n=>{ n.y=top; nodes.push(n); });
    if(prev) prev.forEach(p=>row.forEach(n=>edges.push([p.x,p.y+NH,n.x,n.y])));
    prev=row; y=top+NH+GAP;
  });
  const H=y-GAP+10;
  let g=`<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="var(--muted)"/></marker></defs>`;
  edges.forEach(e=>{ const ym=(e[1]+e[3])/2; g+=`<path class="fe" marker-end="url(#ah)" d="M${e[0]} ${e[1]} C${e[0]} ${ym} ${e[2]} ${ym} ${e[2]} ${e[3]-1}"/>`; });
  nodes.forEach(n=>{
    const term = /^(Start|Ende|Trigger aus CRM)$/.test(n.text);
    const lines = wrapText(n.text, 24);
    if(n.label) g+=`<text class="cond" x="${n.x-NW/2}" y="${n.y-5}">${esc(n.label)}</text>`;
    g+=`<rect class="${/^(Start|Ende)$/.test(n.text)?"nodes":"nodeb"}" x="${n.x-NW/2}" y="${n.y}" width="${NW}" height="${NH}" rx="${/^(Start|Ende)$/.test(n.text)?20:0}"/>`;
    const y0 = n.y + NH/2 - (lines.length-1)*7 + 4;
    g+=`<text x="${n.x}" y="${y0}" text-anchor="middle">${lines.map((l,k)=>`<tspan x="${n.x}" dy="${k?14:0}">${esc(l)}</tspan>`).join("")}</text>`;
  });
  return `<svg class="flow" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Ablaufdiagramm">${g}</svg>`;
}
function ovData(d){
  const total = S.live ? 30 : R.messages.length;
  const done = S.live ? Math.min(total, S.shown.length) : S.shown.filter(m=>R.messages.some(r=>r.id===m.id)).length;
  const pct = S.ended && !S.rejected ? 100 : Math.round(done/total*100);
  const A = R.artifacts;
  const resIds = new Set([].concat(A.stories,A.design,A.adrs,A.bsiArtifacts).map(x=>x.id));
  const totalRes = S.live ? Math.max(resIds.size, 18) : resIds.size, seen = new Set(), series = [];
  S.shown.forEach(m=>{ (m.refs||[]).forEach(r=>{ if(resIds.has(r)) seen.add(r); }); series.push(seen.size); });
  const counts = {}; S.shown.forEach(m=>{ counts[m.from]=(counts[m.from]||0)+1; });
  const agentsList = [{id:"human",name:"Kunde (Mensch)"}].concat(R.agents).map(a=>({id:a.id,name:a.name,n:counts[a.id]||0}));
  const prio = {Must:0,Should:0,Could:0}; d.stories.forEach(s=>{ prio[s.priority]=(prio[s.priority]||0)+1; });
  const types = {process:0,eip:0,"cx-design":0}; d.arts.forEach(a=>{ types[a.type]=(types[a.type]||0)+1; });
  const covered = d.stories.filter(s=>{
    const ds = d.design.filter(x=>x.stories.includes(s.id)).map(x=>x.id);
    return d.arts.some(a=>a.designRefs.some(r=>ds.includes(r)));
  }).length;
  return {total,done,pct,totalRes,series,agentsList,prio,types,covered};
}
function ovHtml(d){
  const o = ovData(d);
  const phase = S.ended ? (S.rejected?"Abgebrochen":"Abgeschlossen") : (S.phase?PHASE_LABEL[S.phase]:"Noch nicht gestartet");
  // Fortschritt
  const w1 = `<div class="wd"><h4>Fortschritt</h4><div class="big">${o.pct}<small>%</small></div><div class="sub">${esc(phase)} · ${o.done} von ${o.total} Schritten</div><div class="meter" role="progressbar" aria-valuenow="${o.pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${o.pct}%"></i></div></div>`;
  // Abdeckung
  const cp = d.stories.length ? Math.round(o.covered/d.stories.length*100) : 0;

  return `<div class="wgrid">${w1}${w2}${w3}${w4}${w5}${w5b}${w6}${w7}</div>`;
}
function bindOv(){
  const hit = $("#spHit"); if(!hit) return;

  hit.addEventListener("mousemove", e=>{
    if(!o.series.length) return;
    const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    const x = (e.clientX - r.left) / r.width * vb.width;
    const pl=30, pr=34, n=o.total;
    let i = Math.round((x-pl)/(vb.width-pl-pr)*n) - 1; i = Math.max(0, Math.min(o.series.length-1, i));

  });

}

function treeText(paths){
  const root = {};
  paths.forEach(p=>{ let n=root; p.split("/").forEach(part=>{ n[part]=n[part]||{}; n=n[part]; }); });
  const out=[]; (function walk(n,pre){
    const keys=Object.keys(n);
    keys.forEach((k,i)=>{ const last=i===keys.length-1; const isDir=Object.keys(n[k]).length>0;
      out.push(pre+(last?"└── ":"├── ")+k+(isDir?"/":"")); if(isDir) walk(n[k], pre+(last?"    ":"│   ")); });
  })(root,"");
  return "bsi-agent-export-"+slug()+".zip\n"+out.join("\n");
}
async function downloadZip(){
  if(!(S.ended && !S.rejected)){ toast("Der Export ist erst nach Abschluss des Laufs möglich."); return; }

  try{
    const zip = new JSZip();
    for(const f of buildFiles()){
      if(f.eipFiles){ const z=new JSZip(); f.eipFiles.forEach(x=>z.file(x.path,x.content,{createFolders:false})); zip.file(f.path, await z.generateAsync({type:"uint8array"})); }
      else zip.file(f.path, f.content);
    }
    const blob = await zip.generateAsync({type:"blob"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `bsi-agent-export-${slug()}-${new Date().toISOString().slice(0,10).replace(/-/g,"")}.zip`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    toast("ZIP wurde erzeugt.");

/* ---------- Engine ---------- */
function schedule(fn, ms){
  S.pending = fn;
  if(S.paused) return;
  clearTimeout(S.tm);
  const id = runId;
  S.tm = setTimeout(()=>{ if(id!==runId) return; S.pending=null; fn(); }, ms);
}
function next(){
  if(S.ended) return;
  if(S.live && S.idx >= R.messages.length){ if(S.shown.length >= MSG_LIMIT){ toast("Nachrichtenlimit erreicht. Lauf wird beendet."); finish(); return; } liveProduce(); return; }
  if(S.idx >= R.messages.length){ finish(); return; }
  if(S.shown.length >= MSG_LIMIT){ toast("Nachrichtenlimit erreicht. Lauf wird beendet."); finish(); return; }
  const m = R.messages[S.idx];
  if(m.from==="human" && (S.idx===0 || !$("#auto").checked)){
    S.wait = S.idx===0 ? "user-start" : "user-answer";
    $("#inp").value = m.body; renderComposer(); return;
  }
  S.wait = null; renderComposer();
  schedule(()=>deliver(m, null), Math.max(200, (m.delayMs||800)/S.speed));
}
function deliver(m, override){
  const msg = Object.assign({}, m, override!=null ? {body:override} : {});
  S.started = true; S.wait = null;
  if(msg.onShow){ try{ msg.onShow(); }catch(e){} }
  S.shown.push(msg); S.phase = msg.phase; S.working = msg.from;
  renderControls(); renderSteps(); renderMetrics(); renderAgents(); renderComposer();
  // Timeline: vorherige einklappen, neue anhängen
  const tl = $("#timeline");
  if(S.shown.length===1) tl.innerHTML = "";
  tl.querySelectorAll(".msg details").forEach(d=>{ d.open=false; });
  const vis = passes(msg);
  let target = null;
  if(vis){
    tl.insertAdjacentHTML("beforeend", msgHtml(msg, ""));
    target = tl.lastElementChild.querySelector(".body"); tl.scrollTop = tl.scrollHeight;
  }
  // Chat: Beiträge mit Mensch
  let chatBody = null;
  if(msg.from==="human" || msg.to==="human"){
    const ch = $("#chat"); const old = ch.querySelector("#gateCard"); if(old) old.remove();
    const isMe = msg.from==="human";
    ch.insertAdjacentHTML("beforeend", isMe
      ? `<div class="bubble me"><small>Sie</small><span class="body"></span></div>`
      : `<div class="bubble pm ${msg.type==="question"?"q":""}"><small>${esc(AG.PM.name)} · ${esc(msg.subject)}</small><span class="body"></span></div>`);
    chatBody = ch.lastElementChild.querySelector(".body"); ch.scrollTop = ch.scrollHeight;
  }
  typeText(msg.body, [target, chatBody], ()=>{
    S.working = null;
    afterDeliver(msg);
  });
  if(msg.to==="human" && msg.from==="PM" && $("#tts").checked && "speechSynthesis" in window){
    try{ const u=new SpeechSynthesisUtterance(msg.body); u.lang="de-DE"; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){}
  }
}
function typeText(text, els, done){
  els = els.filter(Boolean);
  const set = t => els.forEach(e=>{ e.textContent = t; });
  if(reduce || !els.length || text.length < 2){ set(text); done(); return; }
  const dur = Math.min(3200, Math.max(500, text.length*16)) / S.speed;
  const steps = Math.max(1, Math.round(dur/30)), per = Math.ceil(text.length/steps);
  let i = 0; const id = runId;
  clearInterval(S.typer);
  S.typer = setInterval(()=>{
    if(id!==runId){ clearInterval(S.typer); return; }
    i = Math.min(text.length, i+per); set(text.slice(0,i));
    const tl=$("#timeline"); tl.scrollTop = tl.scrollHeight; const ch=$("#chat"); ch.scrollTop = ch.scrollHeight;
    if(i>=text.length){ clearInterval(S.typer); done(); }
  }, 30);
}
function afterDeliver(msg){
  renderAgents(); renderMetrics(); renderTabs();
  if($("#follow").checked && S.tab!=="ov") followTab(msg);
  renderResults();
  if(msg.gate){ S.wait = "gate"; S.gateNote = false; renderChat(); renderComposer(); focusGate(); return; }
  S.idx++; next();
}
function followTab(msg){

  const map = [[/^(REQ|EP)-/,"req"],[/^US-/,"stories"],[/^ADR-/,"adr"],[/^ART-/,"bsi"],[/^F-/,"bsi"],[/^A-/,"ann"]];
  for(const [re,t] of map){ if(re.test(r)){ S.tab=t; return; } }
  if(/^DES-/.test(r)){ const d=R.artifacts.design.find(x=>x.id===r); S.tab = d&&d.kind==="technisch"?"tech":"fach"; }
}
function finish(){
  S.ended = true; S.wait = null; S.working = null; S.phase = "export";

    if(S.idx===0 && !S.live) useReplay(pickScenario(v));
    const m = R.messages[S.idx];
    S.wait = null; if(S.idx===0) { S.t0=Date.now(); }
    deliver(m, v); $("#inp").value = "";
  }
}

/* ---------- Spracheingabe ---------- */
function attachMic(btn, ta){
  if(!btn || !ta) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  btn.addEventListener("click", ()=>{
    if(!SR){ toast("Dieser Browser unterstützt keine Spracheingabe. Bitte Chrome oder Edge verwenden oder den Text eintippen."); return; }
    if(rec){ try{rec.stop();}catch(e){} return; }
    const r = new SR(); rec = r; r.lang = "de-DE"; r.interimResults = true; r.continuous = true;
    const base = ta.value ? ta.value.trimEnd()+" " : "";
    r.onresult = e => { let t=""; for(let i=0;i<e.results.length;i++) t += e.results[i][0].transcript; ta.value = base + t; };
    r.onerror = e => {
      toast(e.error==="not-allowed" || e.error==="service-not-allowed"
        ? "Mikrofon nicht freigegeben. Bitte Freigabe im Browser erteilen oder den Text eintippen."
        : e.error==="no-speech" ? "Keine Sprache erkannt. Bitte erneut versuchen." : "Spracheingabe beendet ("+e.error+"). Texteingabe bleibt möglich.");
    };
    r.onend = () => { if(rec===r) rec=null; btn.classList.remove("rec"); btn.setAttribute("aria-pressed","false"); };
    try{ r.start(); btn.classList.add("rec"); btn.setAttribute("aria-pressed","true"); }
    catch(err){ rec=null; toast("Spracheingabe konnte nicht gestartet werden."); }
  });
}

function setPaused(p){
  if(!S.started || S.ended) return;

}
function jumpTo(id){
  const map = [[/^(REQ|EP)-/,"req"],[/^US-/,"stories"],[/^ADR-/,"adr"],[/^ART-/,"bsi"],[/^F-/,"bsi"],[/^A-/,"ann"]];
  let tab=null; for(const [re,t] of map){ if(re.test(id)){ tab=t; break; } }
  if(/^DES-/.test(id)){ const d=R.artifacts.design.find(x=>x.id===id); tab = d&&d.kind==="technisch"?"tech":"fach"; }
  if(!tab) return;
  S.tab = tab; renderTabs(); renderResults();
  const el = $("#results").querySelector(`[data-ref="${CSS.escape(id)}"]`);
  if(el){ el.scrollIntoView({block:"center"}); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
  else toast(id+" wurde noch nicht erarbeitet.");
}
function togglePres(){
  const on = document.documentElement.classList.toggle("pres");
  try{
    if(on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
    if(!on && document.fullscreenElement) document.exitFullscreen().catch(()=>{});

}

document.addEventListener("keydown", e=>{

(function(){

  else{ // optional: logo.svg oder logo.png neben dieser Datei

  }

const LIVE_EX = [
  "Wir sind ein Finanzdienstleister und wollen Kreditanfragen digital annehmen, automatisch vorprüfen und Interessenten, die abbrechen, gezielt nachfassen. Auffällige Anfragen soll ein Berater prüfen.",
  "Unser Beschwerdemanagement ist heute auf E-Mail und Excel verteilt. Wir wollen Beschwerden zentral erfassen, nach Dringlichkeit routen, Fristen überwachen und Kunden über den Stand informieren."
];

function pickScenario(text){
  return /strom|gas\b|zähler|zaehler|energie|ablesung|abrechnung|wasser|fernwärme|netz/i.test(text) ? "energie" : "versicherung";

function useReplay(sc){
  if(sc===S.scn) return;
  R = window.REPLAYS[sc]; R.agents = R.agents.map(a=>a.id==="PM" ? Object.assign({}, a, {name:PM_NAME}) : a);

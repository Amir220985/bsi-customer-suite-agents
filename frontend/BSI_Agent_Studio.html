/* ---------- Live-Modus ---------- */
const CFG_KEY = "bsi-studio-live";
function loadCfg(){ try{ const c=JSON.parse(localStorage.getItem(CFG_KEY)||"null"); return c&&c.url?c:null; }catch(e){ return null; } }
function saveCfg(c){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(c)); }catch(e){ toast("Einstellungen konnten nicht gespeichert werden."); } }
function makeLiveRun(base){
  return {id:"live-"+base.id, title:"Live-Lauf", scenario:base.scenario, language:"de", agents:base.agents, phases:base.phases,
    messages:[Object.assign({}, base.messages[0], {delayMs:300})], assumptions:[],
    artifacts:{requirements:[],epics:[],stories:[],design:[],adrs:[],bsiArtifacts:[],findings:[]}};
}
async function liveApi(body, cfg){
  const c = cfg || L.cfg; if(!c) throw new Error("Live-Modus ist nicht eingerichtet");
  const ctl = new AbortController(), t = setTimeout(()=>ctl.abort(), 60000);
  const h = {"content-type":"application/json"};
  if(c.anon){ h.authorization = "Bearer "+c.anon; h.apikey = c.anon; }
  if(c.token) h["x-app-token"] = c.token;
  try{
    const r = await fetch(c.url, {method:"POST", headers:h, body:JSON.stringify(body), signal:ctl.signal});
    const j = await r.json().catch(()=>({}));
    if(!r.ok || !j.ok) throw new Error(j.error || ("Serverfehler "+r.status));
    return j;
  }catch(e){
    throw new Error(e.name==="AbortError" ? "Zeitüberschreitung nach 60 Sekunden" : (e instanceof TypeError ? "Server nicht erreichbar (URL, CORS oder Netz prüfen)" : e.message));
  }finally{ clearTimeout(t); }
}
const stepApi = async (task, input) => (await liveApi({action:"step", task, input})).result;
const LIDS = a => a.map(x=>x.id);
function LM(phase, from, to, type, subject, body, o){
  return Object.assign({id:"L"+String(++L.n).padStart(2,"0"), phase, from, to, type, subject, body, delayMs:900, refs:[]}, o||{});
}
const DEVA = {process:"DEV_PROCESS", eip:"DEV_EIP", cx:"DEV_CX"};
const BUSY = ["PM fasst die Anforderung zusammen","Rückfragen werden gesammelt und gebündelt","Anforderungen und Stories entstehen","Architekt erstellt das Lösungsdesign","Entwicklungs-Agenten arbeiten","QA prüft die Artefakte","PM stellt das Ergebnis zusammen"];
const BUSYA = ["PM","RE","RE","ARCH","DEV_EIP","QA","PM"];

async function liveStep(){
  const A = R.artifacts, ch = S.changes.slice(), req = (S.shown[0]||{}).body||"";
  switch(L.step){
    case 0: {
      const r = await stepApi("recap", {requirement:req});
      A.requirements = r.requirements;
      return [LM("intake","PM","human","info","Rückfassung", r.recap),
              LM("klaerung","PM","RE","handoff","Auftrag Anforderungsanalyse","Bitte die Anforderung prüfen und Lücken benennen.",{refs:LIDS(r.requirements)})];
    }
    case 1: {
      const g = await stepApi("gaps", {requirement:req, requirements:A.requirements});
      const b = await stepApi("bundle", {requirement:req, requirements:A.requirements, gaps:g});
      return [LM("klaerung","RE","PM","question","Lücken in der Anforderung", g.re),
              LM("klaerung","PO","PM","question","Fragen zu Umfang und Termin", g.po),
              LM("klaerung","ARCH","PM","question","Technische Rahmenbedingungen", g.arch),
              LM("klaerung","PM","human","question","Gebündelte Rückfragen (Runde 1)", b.questions, {needsHuman:true, delayMs:1400}),
              LM("klaerung","human","PM","answer","Antworten des Kunden", b.suggested_answer)];
    }
    case 2: {
      const ans = ([].concat(S.shown).reverse().find(m=>m.from==="human"&&m.type==="answer")||{}).body || "";
      const r = await stepApi("stories", {requirement:req, requirements:A.requirements, answer:ans, changes:ch});
      A.epics = r.epics; A.stories = r.stories; R.assumptions = r.assumptions;
      const n = p => r.stories.filter(x=>x.priority===p).length;
      return [LM("klaerung","PM","RE","decision","Antworten weitergegeben","Annahmen dokumentiert: "+(LIDS(r.assumptions).join(", ")||"keine")+".",{refs:LIDS(r.assumptions)}),
              LM("anforderungen","RE","PO","artifact","Epics und User Stories", r.epics.length+" Epics und "+r.stories.length+" Stories mit Akzeptanzkriterien.",{refs:LIDS(r.epics).concat(LIDS(r.stories)), delayMs:1800}),
              LM("anforderungen","PO","PM","decision","Priorisierung","Must: "+n("Must")+", Should: "+n("Should")+", Could: "+n("Could")+"."),
              LM("anforderungen","PM","human","gate","Gate 1: Anforderungsumfang bestätigen", r.summary+(r.assumptions.length?" Offene Annahmen: "+r.assumptions.map(a=>a.id+" ("+a.text+")").join("; "):""),
                 {needsHuman:true, gate:{id:"gate-1", options:["freigeben","aenderung","ablehnen"]}})];
    }
    case 3: {
      const r = await stepApi("design", {requirement:req, requirements:A.requirements, epics:A.epics, stories:A.stories, assumptions:R.assumptions, changes:ch});
      A.design = r.design; A.adrs = r.adrs;
      const fa = r.design.filter(d=>d.kind==="fachlich"), te = r.design.filter(d=>d.kind==="technisch");
      return [LM("loesungsdesign","PM","ARCH","handoff","Auftrag Lösungsdesign","Anforderungsumfang ist freigegeben. Bitte fachliches und technisches Lösungsdesign inklusive ADRs erstellen."),
              LM("loesungsdesign","ARCH","PO","artifact","Fachliches Lösungsdesign", fa.map(d=>d.title).join("; ")+".",{refs:LIDS(fa), delayMs:1800}),
              LM("loesungsdesign","ARCH","PM","artifact","Technisches Design und ADRs", te.map(d=>d.title).join("; ")+". "+r.adrs.length+" Architekturentscheidungen dokumentiert.",{refs:LIDS(te).concat(LIDS(r.adrs)), delayMs:1800}),
              LM("loesungsdesign","PM","human","gate","Gate 2: Lösungsdesign freigeben", r.summary+" Nach Ihrer Freigabe startet die Umsetzung durch die Entwicklungs-Agenten.",
                 {needsHuman:true, gate:{id:"gate-2", options:["freigeben","aenderung","ablehnen"]}})];
    }
    case 4: {
      const kinds = ["process","eip","cx"];
      const res = await Promise.all(kinds.map(k=>stepApi("dev", {kind:k, design:A.design, adrs:A.adrs, stories:A.stories, changes:ch})));
      A.bsiArtifacts = [].concat.apply([], res.map(r=>r.artifacts));
      const te = A.design.filter(d=>d.kind==="technisch"), fa = A.design.filter(d=>d.kind==="fachlich");
      const hr = {process:LIDS(fa).slice(0,1), eip:LIDS(te).slice(0,1), cx:LIDS(te).slice(-1)};
      const ttl = {process:"Umsetzung Prozess", eip:"Umsetzung Schnittstelle", cx:"Umsetzung Kundendesign"};
      const out = kinds.map(k=>LM("umsetzung","PM",DEVA[k],"handoff",ttl[k],"Bitte gemäß Lösungsdesign umsetzen.",{refs:hr[k], delayMs:400}));
      kinds.forEach((k,i)=>out.push(LM("umsetzung",DEVA[k],"QA","artifact",ttl[k].replace("Umsetzung ","")+"-Artefakte", res[i].summary,{refs:LIDS(res[i].artifacts), delayMs:1800})));
      return out;
    }
    case 5: {
      const q = await stepApi("qa", {artifacts:A.bsiArtifacts, stories:A.stories, design:A.design});
      q.findings.forEach(f=>{ f.status = "offen"; });
      A.findings = q.findings;
      const note = " Hinweis: Eine echte Importvalidierung gegen die BSI Customer Suite steht noch aus.";
      if(!q.findings.length) return [LM("qa","QA","PM","info","QA abgeschlossen", q.summary+note)];
      const f = q.findings[0], art = A.bsiArtifacts.find(a=>a.id===f.artifact), kind = art.type==="cx-design"?"cx":art.type;
      const fx = await stepApi("fix", {kind, finding:f, artifact:art, design:A.design});
      const rest = q.findings.length-1;
      return [LM("qa","QA","PM","finding","QA-Befund", q.findings.map(x=>"Befund "+x.id+" ("+x.severity+"): "+x.text).join("\n"),{refs:LIDS(q.findings).concat([f.artifact]), delayMs:1800}),
              LM("qa","PM",DEVA[kind],"handoff","Korrektur "+f.id,"Bitte den Befund beheben: "+f.text,{refs:[f.id], delayMs:700}),
              LM("qa",DEVA[kind],"QA","artifact","Korrigiertes Artefakt", fx.summary,{refs:[art.id], delayMs:1600,
                 onShow:()=>{ const i=A.bsiArtifacts.findIndex(a=>a.id===art.id); if(i>=0) A.bsiArtifacts[i]=fx.artifact; f.status="behoben"; }}),
              LM("qa","QA","PM","info","QA abgeschlossen", (rest?rest+" weitere(r) Befund(e) bleiben offen und stehen im Export. ":"Der Befund wurde behoben. ")+q.summary+note,{refs:[f.id], delayMs:1200})];
    }
    case 6: {
      const open = R.artifacts.findings.filter(f=>f.status!=="behoben").length, fixed = R.artifacts.findings.length-open;
      return [LM("export","PM","human","info","Ergebnis bereit","Das Team hat Anforderungen, Lösungsdesign und Artefakte erarbeitet."+(fixed?" "+fixed+" Befund(e) wurden behoben.":"")+(open?" "+open+" Befund(e) sind offen.":"")+" Das Export-Paket enthält Dokumentation, Traceability und die Artefakte für Prozess, EIP und CX-Design. Die Inhalte sind KI-generiert und fachlich zu prüfen. Status aller Artefakte: 'demo', eine Importvalidierung steht noch aus.", {delayMs:1000})];
    }
  }
  return null;
}
async function liveProduce(){
  const id = runId;
  S.busy = BUSY[L.step] || "Team arbeitet"; S.working = BUSYA[L.step] || "PM"; renderComposer(); renderAgents();
  let msgs;
  try{ msgs = await liveStep(); }
  catch(e){
    if(id!==runId) return;
    S.busy = null; S.working = null; L.err = e.message; S.wait = "error";
    renderChat(); renderComposer(); renderAgents(); return;
  }
  if(id!==runId) return;
  S.busy = null; S.working = null;
  if(!msgs){ finish(); return; }
  L.step++; R.messages.push.apply(R.messages, msgs); next();
}
function setMode(m){
  if(m===MODE) return;
  if(S && S.started && !S.ended && !confirm("Der laufende Lauf wird verworfen. Fortfahren?")) return;
  MODE = m; init(S ? S.scn : "versicherung");
}

function lcMsg(t, cls){ const m=$("#lcMsg"); m.textContent=t; m.className="hint "+(cls||""); }
function dlgCfg(){ return {url:$("#lcUrl").value.trim(), anon:$("#lcAnon").value.trim(), token:$("#lcTok").value.trim()}; }
async function lcTest(){
  const c = dlgCfg(); if(!/^https?:\/\//.test(c.url)){ lcMsg("Bitte eine gültige URL eintragen.","bad"); return null; }

    return {c, info:mdl};

$("#lcClose").addEventListener("click", ()=>$("#liveDlg").close());

$("#modeReplay").addEventListener("click", ()=>setMode("replay"));
$("#liveCfgBtn").addEventListener("click", ()=>{ $("#opts").open=false; openDlg(); });
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-live]"); if(!b) return;
  const a = b.dataset.live;
  if(a==="retry"){ S.wait=null; L.err=null; renderChat(); renderComposer(); next(); }

init("versicherung");
